<main>
  <section class="reviews-section pt-16 pb-24 px-4 md:px-10 lg:px-20 3xl:px-32">
    <swiper-container
      init="false"
      class="w-full flex overflow-hidden"
      slides-per-view="3"
      space-between="30"
      loop="true"
      autoplay="true"
      autoplay-delay="1000"
      speed="300"
      centered-slides="true"
      breakpoints='{
        "1024": { "slidesPerView": 3 },
        "768": { "slidesPerView": 2 },
        "480": { "slidesPerView": 1 }
      }'
    >

      @for (review of reviews; track review.id) {
        <swiper-slide class="flex-shrink-0 w-full md:w-1/2 lg:w-1/3 px-4 py-6 transition-transform">
          <div class="card-fade w-full h-[280px] p-6 bg-white rounded-md shadow-feature-card text-paragraph text-left transition duration-300 hover:shadow-lg hover:scale-[1.02]">
            <div class="flex items-center gap-4 pb-4 capitalize">
              <img [src]="review.image" [alt]="review.client" class="w-12 h-12 rounded-full object-cover border border-light-gray" />
              <div>
                <h2 class="text-lg font-bold text-dark-gray">{{ review.client }}</h2>
                <h4 class="text-sm font-medium text-light-gray">{{ review.location }}</h4>
                <div class="text-yellow flex gap-1 pt-2">
                  <i class="fi fi-ss-star"></i>
                  <i class="fi fi-ss-star"></i>
                  <i class="fi fi-ss-star"></i>
                  <i class="fi fi-ss-star"></i>
                  <i class="fi fi-ss-star"></i>
                </div>
              </div>
            </div>
            <p class="text-sm font-light text-gray mt-2 line-clamp-3">{{ review.testimonial }}</p>
          </div>
        </swiper-slide>
      }
    </swiper-container>
  </section>
</main>
